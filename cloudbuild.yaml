steps:
  # 1. Budowanie obrazu kontenera
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kjw:$COMMIT_SHA', '.']

  # 2. Przesłanie obrazu do Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kjw:$COMMIT_SHA']

  # 3. Wdrożenie do Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kjw' # Nazwa Twojej usługi Cloud Run
      - '--image'
      - 'europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kjw:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'

# KLUCZOWA SEKCJA: Rozwiązuje błąd "invalid argument" przy użyciu własnego konta serwisowego
options:
  logging: CLOUD_LOGGING_ONLY
