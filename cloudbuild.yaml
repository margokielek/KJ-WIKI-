  # 3. Wdrożenie do Cloud Run ze źródła
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run', 'deploy', 'magorzatakielek-lang',
        '--source=.',
        '--region=europe-central2',
        '--platform=managed',
        '--allow-unauthenticated'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
  
